name: Helm docs
on: [pull_request]
permissions:
  contents: read
jobs:
  lint-changelog:
    name: Check all docs
    runs-on: ubuntu-latest
    container:
      image: jnorwood/helm-docs:v1.14.2
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check all charts README.md
      run: sh ci/helm-docs.sh
