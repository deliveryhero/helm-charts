name: Helm Publish
on:
  push:
    branches:
      - master
    paths:
      - 'stable/**'
  workflow_dispatch:
env:
  CHARTS_PATH: stable
  REGISTRY: "ghcr.io/${{ github.repository }}"
jobs:
  package-and-release:
    permissions:
      contents: write
      packages: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.16.4
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Save GPG passphrase and legacy keyring
        run: |
          cat << EOF > passphrase.txt
          ${{ secrets.GPG_PASSPHRASE }}
          EOF
          gpg -o ~/.gnupg/pubring.gpg --export ${{ steps.import_gpg.outputs.keyid }}
          gpg  --batch --pinentry-mode loopback --passphrase $(cat passphrase.txt) -o ~/.gnupg/secring.gpg --export-secret-keys ${{ steps.import_gpg.outputs.keyid }}
      - name: Package new chart versions
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # Only package charts whose name+version is not already in index.yaml.
          # Repackaging an existing version produces a new tarball (fresh file
          # mtimes => new digest, new "created" timestamp) which would overwrite
          # the existing index entry and the already published OCI tag.
          packaged=0
          for d in "${CHARTS_PATH}"/*; do
              if [[ ! -f "${d}/Chart.yaml" ]]; then
                  echo "${d}/Chart.yaml not found. Skipping."
                  continue
              fi
              name="$(yq '.name' "${d}/Chart.yaml")"
              version="$(yq '.version' "${d}/Chart.yaml")"
              if NAME="$name" VERSION="$version" yq -e '.entries[strenv(NAME)][] | select(.version == strenv(VERSION))' index.yaml > /dev/null 2>&1; then
                  echo "Chart ${name}-${version} already in index.yaml. Skipping."
                  continue
              fi
              echo "Packaging chart: ${name}-${version} from ${d}"
              helm dep up "$d"
              helm package --sign "$d" -u --key "${{ steps.import_gpg.outputs.name }}" --passphrase-file passphrase.txt --keyring ~/.gnupg/secring.gpg
              packaged=$((packaged + 1))
          done
          rm passphrase.txt
          echo "Packaged ${packaged} chart(s)"
          if [[ "$packaged" -gt 0 ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
          else
              echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to GitHub Container Registry
        if: steps.package.outputs.changed == 'true'
        shell: bash
        run: echo "${GITHUB_TOKEN}" | helm registry login ${REGISTRY} --username ${GITHUB_ACTOR} --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Push Helm Charts to Github Container Registry as OCI packages
        if: steps.package.outputs.changed == 'true'
        shell: bash
        run: |
          for f in *.tgz ; do
              echo "$f"
              helm push $f oci://${REGISTRY,,}
          done
      - name: Upload the Chart to Rekor
        if: steps.package.outputs.changed == 'true'
        shell: bash
        run: |
          helm plugin install https://github.com/sigstore/helm-sigstore
          for f in *.tgz ; do
              echo "Running sigstore upload for chart: $f"
              helm sigstore upload "$f"
          done
      - name: Generate Helm repo index.yaml
        if: steps.package.outputs.changed == 'true'
        shell: bash
        run: helm repo index . --merge index.yaml
      - name: Update URLs in index.yaml with yq
        if: steps.package.outputs.changed == 'true'
        uses: mikefarah/yq@v4.53.3
        with:
          cmd: yq eval -i '. |= .entries[][] |= .urls[0] = "oci://" + env(REGISTRY) + "/" + .name + ":" + .version' index.yaml
      - name: Create Pull Request
        if: steps.package.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: "Updating index.yaml for ${{ github.ref }}"
          branch: update-index
          delete-branch: true
          title: "[stable/index] Updating index.yaml for ${{ github.ref }}"
          add-paths: |
            index.yaml
          labels: |
            index
            automated pr
