{{- if .Values.ssl.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "metabase.fullname" . }}-ssl
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "metabase.labels" . | indent 4 }}
type: Opaque
data:
  keystore: {{ required "ssl.keyStore is required when ssl.enabled is true" (.Values.ssl.keyStore | default .Values.ssl.keystore) | b64enc | quote }}
  password: {{ required "ssl.keyStorePassword is required when ssl.enabled is true" .Values.ssl.keyStorePassword | b64enc | quote }}
{{- end }}
