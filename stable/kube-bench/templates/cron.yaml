---
apiVersion: {{ template "cronjob.apiVersion" . }}
kind: CronJob
metadata:
  name: {{ template "kube-bench.fullname" . }}
  labels: {{ include "kube-bench.labels" . | nindent 4 }}
spec:
  schedule: {{ quote .Values.cronjob.schedule }}
  concurrencyPolicy: "{{ .Values.concurrencyPolicy }}"
  startingDeadlineSeconds: {{ .Values.cronjob.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        {{- with .Values.podLabels }}
        metadata:
          labels:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        spec:
          {{- if .Values.serviceAccount.create }}
          serviceAccountName: {{ template "kube-bench.fullname" . }}
          {{- end }}
          hostPID: true
          restartPolicy: Never
          containers:
            - name: {{ .Chart.Name }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: {{ template "cronjob.command" . }}
              {{- with .Values.resources }}
              resources: {{ toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.securityContext }}
              securityContext: {{ toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.livenessProbe }}
              livenessProbe: {{ toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.readinessProbe }}
              readinessProbe: {{ toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.volumeMounts }}
              volumeMounts: {{ toYaml . | nindent 16 }}
              {{- end }}
              resources: {{ toYaml .Values.resources | nindent 16 }}
              {{- with .Values.volumeMounts }}
              volumeMounts: {{ toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.securityContext }}
              securityContext: {{ toYaml . | nindent 16 }}
              {{- end }}
          {{- with .Values.volumes }}
          volumes: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations: {{ toYaml . | nindent 12 }}
          {{- end }}
