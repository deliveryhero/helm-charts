---
nameOverride: ""
fullnameOverride: ""

provider: eks

cronjob:
  schedule: "0 0 1 * *"
  command: []
  startingDeadlineSeconds: 300

image:
  repository: aquasec/kube-bench
  tag: v0.15.6
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

extraLabels: {}
podLabels: {}
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
nodeSelector: {}
tolerations: []
affinity: {}
concurrencyPolicy: Forbid

livenessProbe: {}
readinessProbe: {}

volumes:
  - name: var-lib-kubelet
    hostPath:
      path: "/var/lib/kubelet"
  - name: etc-systemd
    hostPath:
      path: "/etc/systemd"
  - name: etc-kubernetes
    hostPath:
      path: "/etc/kubernetes"
  - name: var-lib-etcd
    hostPath:
      path: "/var/lib/etcd"
  - name: var-lib-kube-scheduler
    hostPath:
      path: "/var/lib/kube-scheduler"
  - name: var-lib-kube-controller-manager
    hostPath:
      path: "/var/lib/kube-controller-manager"
  - name: lib-systemd
    hostPath:
      path: "/lib/systemd"
  - name: srv-kubernetes
    hostPath:
      path: "/srv/kubernetes"
  - name: usr-bin
    hostPath:
      path: "/usr/bin"
  - name: etc-cni-netd
    hostPath:
      path: "/etc/cni/net.d"
  - name: opt-cni-bin
    hostPath:
      path: "/opt/cni/bin"
  - name: var-lib-cni
    hostPath:
      path: "/var/lib/cni"

volumeMounts:
  - name: var-lib-kubelet
    mountPath: /var/lib/kubelet
    readOnly: true
  - name: etc-systemd
    mountPath: /etc/systemd
    readOnly: true
  - name: etc-kubernetes
    mountPath: /etc/kubernetes
    readOnly: true
  - name: var-lib-etcd
    mountPath: /var/lib/etcd
    readOnly: true
  - name: var-lib-kube-scheduler
    mountPath: /var/lib/kube-scheduler
    readOnly: true
  - name: var-lib-kube-controller-manager
    mountPath: /var/lib/kube-controller-manager
    readOnly: true
  - name: lib-systemd
    mountPath: /lib/systemd
    readOnly: true
  - name: srv-kubernetes
    mountPath: /srv/kubernetes
    readOnly: true
  - name: usr-bin
    mountPath: /usr/local/mount-from-host/bin
    readOnly: true
  - name: etc-cni-netd
    mountPath: /etc/cni/net.d
    readOnly: true
  - name: opt-cni-bin
    mountPath: /opt/cni/bin
    readOnly: true
  - name: var-lib-cni
    mountPath: /var/lib/cni
    readOnly: true
